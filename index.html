
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b63d8"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <title>التحدي | تسجيل الدخول</title>


    <!-- =========================================
         FONT
    ========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================
         STYLE
    ========================================== -->

    <style>

        /* =========================================
           RESET
        ========================================== */

        *,
        *::before,
        *::after {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            -webkit-tap-highlight-color: transparent;

        }


        html {

            width: 100%;

            height: 100%;

            background: #ffffff;

        }


        body {

            width: 100%;

            min-height: 100dvh;

            font-family:
                "Cairo",
                Arial,
                sans-serif;

            background: #ffffff;

            color: #10233f;

            overflow: hidden;

            -webkit-font-smoothing: antialiased;

        }


        button,
        input {

            font-family:
                "Cairo",
                Arial,
                sans-serif;

        }


        /* =========================================
           VARIABLES
        ========================================== */

        :root {

            --blue: #0b63d8;

            --blue-dark: #0649a8;

            --blue-light: #edf5ff;

            --red: #d71920;

            --text: #10233f;

            --muted: #7a8798;

            --border: #e3eaf3;

            --white: #ffffff;

        }


        /* =========================================
           APP
        ========================================== */

        .app {

            position: relative;

            width: 100%;

            min-height: 100dvh;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            isolation: isolate;

        }


        /* =========================================
           BACKGROUND
        ========================================== */

        .background {

            position: absolute;

            inset: 0;

            z-index: -1;

            overflow: hidden;

            pointer-events: none;

        }


        .background::before {

            content: "";

            position: absolute;

            width: 280px;

            height: 280px;

            top: -130px;

            right: -110px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(11,99,216,.17) 0%,
                    rgba(11,99,216,.05) 45%,
                    transparent 72%
                );

            animation:
                backgroundFloat1
                9s
                ease-in-out
                infinite;

        }


        .background::after {

            content: "";

            position: absolute;

            width: 260px;

            height: 260px;

            bottom: -150px;

            left: -110px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(215,25,32,.10) 0%,
                    rgba(215,25,32,.03) 48%,
                    transparent 72%
                );

            animation:
                backgroundFloat2
                11s
                ease-in-out
                infinite;

        }


        @keyframes backgroundFloat1 {

            0%,
            100% {

                transform:
                    translate3d(0,0,0)
                    scale(1);

            }

            50% {

                transform:
                    translate3d(-18px,22px,0)
                    scale(1.08);

            }

        }


        @keyframes backgroundFloat2 {

            0%,
            100% {

                transform:
                    translate3d(0,0,0)
                    scale(1);

            }

            50% {

                transform:
                    translate3d(25px,-20px,0)
                    scale(1.1);

            }

        }


        /* =========================================
           DECORATIVE DOTS
        ========================================== */

        .dot {

            position: absolute;

            border-radius: 50%;

            background: var(--blue);

            opacity: .10;

            animation:
                dotFloat
                6s
                ease-in-out
                infinite;

        }


        .dot-1 {

            width: 9px;

            height: 9px;

            top: 17%;

            left: 12%;

        }


        .dot-2 {

            width: 6px;

            height: 6px;

            top: 30%;

            right: 13%;

            animation-delay: -2s;

        }


        .dot-3 {

            width: 8px;

            height: 8px;

            bottom: 24%;

            right: 19%;

            animation-delay: -4s;

        }


        @keyframes dotFloat {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-12px);

            }

        }


        /* =========================================
           MAIN CONTENT
        ========================================== */

        .content {

            width: 100%;

            padding:
                max(20px, env(safe-area-inset-top))
                20px
                max(18px, env(safe-area-inset-bottom))
                20px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            animation:
                contentEnter
                .8s
                cubic-bezier(.22,.61,.36,1)
                both;

        }


        @keyframes contentEnter {

            from {

                opacity: 0;

                transform:
                    translateY(25px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================================
           LOGO
        ========================================== */

        .brand {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            margin-bottom: 22px;

        }


        .logo-wrapper {

            position: relative;

            width: 100px;

            height: 100px;

            margin-bottom: 11px;

            animation:
                logoFloat
                4s
                ease-in-out
                infinite;

        }


        .logo-wrapper::before {

            content: "";

            position: absolute;

            inset: -12px;

            border-radius: 31px;

            background:
                radial-gradient(
                    circle,
                    rgba(11,99,216,.12),
                    transparent 68%
                );

            animation:
                logoPulse
                3s
                ease-in-out
                infinite;

        }


        .logo {

            position: relative;

            z-index: 2;

            display: block;

            width: 100%;

            height: 100%;

            object-fit: contain;

            border-radius: 25px;

        }


        .logo-fallback {

            position: relative;

            z-index: 2;

            width: 100%;

            height: 100%;

            border-radius: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #ffffff;

            font-size: 40px;

            font-weight: 900;

            background:
                linear-gradient(
                    145deg,
                    var(--blue),
                    var(--blue-dark)
                );

            box-shadow:
                0 15px 35px
                rgba(11,99,216,.23);

        }


        @keyframes logoFloat {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-6px);

            }

        }


        @keyframes logoPulse {

            0%,
            100% {

                transform:
                    scale(.95);

                opacity: .45;

            }

            50% {

                transform:
                    scale(1.08);

                opacity: .9;

            }

        }


        /* =========================================
           BRAND TEXT
        ========================================== */

        .brand-title {

            font-size: 30px;

            line-height: 1.2;

            font-weight: 900;

            color: var(--blue-dark);

            letter-spacing: -.5px;

        }


        .brand-title b {

            color: var(--red);

        }


        .brand-subtitle {

            margin-top: 4px;

            font-size: 12px;

            font-weight: 600;

            color: var(--muted);

        }


        /* =========================================
           LOGIN CARD
        ========================================== */

        .login-card {

            width: 100%;

            max-width: 390px;

            padding:
                26px
                21px
                24px;

            background:
                rgba(255,255,255,.97);

            border:
                1px solid
                rgba(11,99,216,.08);

            border-radius: 24px;

            box-shadow:
                0 20px 55px
                rgba(16,35,63,.09);

            animation:
                cardEnter
                .9s
                .1s
                ease
                both;

        }


        @keyframes cardEnter {

            from {

                opacity: 0;

                transform:
                    translateY(18px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =========================================
           CARD TEXT
        ========================================== */

        .login-heading {

            text-align: center;

            font-size: 18px;

            font-weight: 800;

            color: var(--text);

        }


        .login-description {

            text-align: center;

            margin-top: 4px;

            margin-bottom: 21px;

            color: var(--muted);

            font-size: 11px;

            font-weight: 500;

        }


        /* =========================================
           INPUT
        ========================================== */

        .input-wrapper {

            position: relative;

            width: 100%;

            margin-bottom: 13px;

        }


        .input-label {

            display: block;

            margin-bottom: 7px;

            padding-right: 3px;

            font-size: 11px;

            color: #647286;

            font-weight: 700;

        }


        .input-icon {

            position: absolute;

            right: 15px;

            bottom: 0;

            width: 44px;

            height: 56px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: var(--blue);

            font-size: 11px;

            font-weight: 900;

            pointer-events: none;

        }


        .id-input {

            display: block;

            width: 100%;

            height: 56px;

            border:
                1.8px solid
                var(--border);

            border-radius: 15px;

            outline: none;

            background: #f9fbfe;

            color: var(--text);

            font-size: 15px;

            font-weight: 700;

            direction: ltr;

            text-align: left;

            padding:
                0
                48px
                0
                15px;

            transition:
                border-color .2s ease,
                background .2s ease,
                box-shadow .2s ease;

            -webkit-appearance: none;

            appearance: none;

        }


        .id-input::placeholder {

            color: #a8b3c1;

            font-size: 13px;

            font-weight: 500;

        }


        .id-input:focus {

            border-color:
                var(--blue);

            background:
                #ffffff;

            box-shadow:
                0 0 0 4px
                rgba(11,99,216,.07);

        }


        /* =========================================
           LOGIN BUTTON
        ========================================== */

        .login-button {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            height: 56px;

            border: 0;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #0b63d8,
                    #0649a8
                );

            color: #ffffff;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                0 11px 25px
                rgba(11,99,216,.22);

            transition:
                transform .18s ease,
                box-shadow .18s ease,
                opacity .18s ease;

            -webkit-user-select: none;

            user-select: none;

        }


        .login-button:active {

            transform:
                scale(.98);

            box-shadow:
                0 6px 15px
                rgba(11,99,216,.18);

        }


        .login-button:disabled {

            opacity: .8;

            cursor:
                default;

        }


        .button-shine {

            position: absolute;

            top: 0;

            left: -110%;

            width: 70%;

            height: 100%;

            transform:
                skewX(-20deg);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.25),
                    transparent
                );

            animation:
                shine
                4.5s
                ease-in-out
                infinite;

        }


        @keyframes shine {

            0%,
            35% {

                left: -110%;

            }

            70%,
            100% {

                left: 150%;

            }

        }


        .button-text {

            position: relative;

            z-index: 2;

        }


        /* =========================================
           LOADING DOTS
        ========================================== */

        .loading {

            position: relative;

            z-index: 2;

            display: none;

            align-items: center;

            justify-content: center;

            gap: 6px;

        }


        .loading.active {

            display: flex;

        }


        .loading span {

            width: 6px;

            height: 6px;

            border-radius: 50%;

            background:
                #ffffff;

            animation:
                loadingDots
                .75s
                infinite
                alternate;

        }


        .loading span:nth-child(2) {

            animation-delay:
                .2s;

        }


        .loading span:nth-child(3) {

            animation-delay:
                .4s;

        }


        @keyframes loadingDots {

            from {

                opacity: .25;

                transform:
                    translateY(0);

            }

            to {

                opacity: 1;

                transform:
                    translateY(-4px);

            }

        }


        /* =========================================
           MESSAGE
        ========================================== */

        .message {

            display: none;

            width: 100%;

            margin-top: 12px;

            padding:
                10px
                12px;

            border-radius: 12px;

            text-align: center;

            font-size: 11px;

            line-height: 1.7;

            font-weight: 700;

        }


        .message.show {

            display: block;

            animation:
                messageIn
                .25s
                ease
                both;

        }


        .message.error {

            color: #a20f16;

            background:
                #fff1f2;

            border:
                1px solid
                #ffd5d8;

        }


        .message.success {

            color: #086033;

            background:
                #edfff5;

            border:
                1px solid
                #c8efd9;

        }


        @keyframes messageIn {

            from {

                opacity: 0;

                transform:
                    translateY(-4px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================================
           FOOTER
        ========================================== */

        .footer {

            margin-top: 15px;

            text-align: center;

            color: #a2adba;

            font-size: 9px;

            font-weight: 600;

        }


        .footer strong {

            color:
                var(--red);

        }


        /* =========================================
           FULL SCREEN LOADER
        ========================================== */

        .page-loader {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 14px;

            background:
                rgba(255,255,255,.98);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .25s ease,
                visibility .25s ease;

        }


        .page-loader.active {

            opacity: 1;

            visibility: visible;

        }


        .loader-circle {

            width: 46px;

            height: 46px;

            border:
                4px solid
                #e6eefb;

            border-top-color:
                var(--blue);

            border-right-color:
                var(--red);

            border-radius: 50%;

            animation:
                rotateLoader
                .75s
                linear
                infinite;

        }


        .loader-title {

            font-size: 12px;

            font-weight: 800;

            color: var(--text);

        }


        @keyframes rotateLoader {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =========================================
           SMALL PHONES
        ========================================== */

        @media (max-height: 680px) {

            .content {

                padding-top: 12px;

                padding-bottom: 12px;

            }


            .brand {

                margin-bottom: 12px;

            }


            .logo-wrapper {

                width: 72px;

                height: 72px;

                margin-bottom: 5px;

            }


            .brand-title {

                font-size: 25px;

            }


            .brand-subtitle {

                font-size: 10px;

            }


            .login-card {

                padding:
                    19px
                    18px
                    18px;

                border-radius: 21px;

            }


            .login-heading {

                font-size: 16px;

            }


            .login-description {

                margin-bottom: 14px;

            }


            .input-label {

                margin-bottom: 5px;

            }


            .id-input,
            .login-button {

                height: 50px;

            }


            .input-icon {

                height: 50px;

            }


            .footer {

                margin-top: 9px;

            }

        }


        /* =========================================
           TABLET / DESKTOP
           ما يزال Mobile First
        ========================================== */

        @media (min-width: 600px) {

            .content {

                max-width: 500px;

            }


            .login-card {

                max-width: 430px;

                padding:
                    31px
                    28px
                    27px;

            }


            .logo-wrapper {

                width: 110px;

                height: 110px;

            }


            .brand-title {

                font-size: 34px;

            }

        }


    </style>

</head>


<body>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="background">

        <span class="dot dot-1"></span>

        <span class="dot dot-2"></span>

        <span class="dot dot-3"></span>

    </div>


    <!-- =========================================
         PAGE LOADER
    ========================================== -->

    <div
        class="page-loader"
        id="pageLoader"
    >

        <div class="loader-circle"></div>

        <div class="loader-title">
            جاري فتح حسابك...
        </div>

    </div>


    <!-- =========================================
         APP
    ========================================== -->

    <main class="app">


        <div class="content">


            <!-- =================================
                 BRAND
            ================================== -->

            <div class="brand">


                <div class="logo-wrapper">


                    <!--
                        ضع شعار المدرسة باسم:
                        logo.png
                    -->

                    <img
                        src="logo.png"
                        alt="شعار مدرسة التحدي"
                        class="logo"
                        id="schoolLogo"
                    >


                    <div
                        class="logo-fallback"
                        id="logoFallback"
                        style="display:none;"
                    >
                        ت
                    </div>


                </div>


                <h1 class="brand-title">

                    التحدي<span>.</span>

                </h1>


                <p class="brand-subtitle">

                    نظام مدرسة التحدي

                </p>


            </div>



            <!-- =================================
                 LOGIN CARD
            ================================== -->

            <section class="login-card">


                <h2 class="login-heading">

                    تسجيل الدخول

                </h2>


                <p class="login-description">

                    أدخل الـ ID الخاص بك للدخول إلى حسابك

                </p>



                <!-- =================================
                     LOGIN FORM
                ================================== -->

                <form
                    id="loginForm"
                    autocomplete="off"
                >


                    <div class="input-wrapper">


                        <label
                            class="input-label"
                            for="userId"
                        >
                            معرف الحساب
                        </label>


                        <div class="input-icon">
                            ID
                        </div>


                        <input
                            type="text"
                            id="userId"
                            class="id-input"
                            placeholder="مثال: STU001"
                            inputmode="text"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="characters"
                            spellcheck="false"
                            maxlength="100"
                            required
                        >


                    </div>



                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >


                        <span
                            class="button-shine"
                        ></span>


                        <span
                            class="button-text"
                            id="buttonText"
                        >
                            تسجيل الدخول
                        </span>


                        <span
                            class="loading"
                            id="loading"
                        >

                            <span></span>

                            <span></span>

                            <span></span>

                        </span>


                    </button>



                    <div
                        class="message"
                        id="message"
                    ></div>


                </form>


            </section>



            <!-- =================================
                 FOOTER
            ================================== -->

            <div class="footer">

                جميع الحقوق محفوظة ©
                <strong>مدرسة التحدي</strong>

            </div>


        </div>


    </main>



    <!-- =========================================
         FIREBASE
    ========================================== -->

        const firebaseConfig = {

        /* ========================================

        const firebaseApp =
            initializeApp(
                firebaseConfig
            );


        const db =
            getFirestore(
                firebaseApp
            );


        /* ========================================

        ========================================= */

        const form =
            document.getElementById(
                "loginForm"
            );


        const userId =
            document.getElementById(
                "userId"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const buttonText =
            document.getElementById(
                "buttonText"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        const message =
            document.getElementById(
                "message"
            );


        const pageLoader =
            document.getElementById(
                "pageLoader"
            );


        const schoolLogo =
            document.getElementById(
                "schoolLogo"
            );


        const logoFallback =
            document.getElementById(
                "logoFallback"
            );


        /* ========================================
           ACCOUNT ROUTES
        ========================================= */

        const routes = {

            admin:
                "admin.html",

            teacher:
                "teacher.html",

            student:
                "student.html",

            accountant:
                "accountant.html"

        };


        /* ========================================
           SHOW MESSAGE
        ========================================= */

        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent =
                text;

            message.className =
                "message show " + type;

        }


        /* ========================================
           HIDE MESSAGE
        ========================================= */

        function hideMessage() {

            message.textContent =
                "";

            message.className =
                "message";

        }


        /* ========================================
           LOADING BUTTON
        ========================================= */

        function setButtonLoading(
            state
        ) {

            loginButton.disabled =
                state;


            if (state) {

                buttonText.style.display =
                    "none";

                loading.classList.add(
                    "active"
                );

            } else {

                buttonText.style.display =
                    "block";

                loading.classList.remove(
                    "active"
                );

            }

        }


        /* ========================================
           CLEAN ID
        ========================================= */

        function normalizeID(
            value
        ) {

            return value
                .trim()
                .replace(/\s+/g, "")
                .toUpperCase();

        }


        /* ========================================
           LOGIN
        ========================================= */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                hideMessage();


                const id =
                    normalizeID(
                        userId.value
                    );


                /* =================================
                   VALIDATION
                ================================= */

                if (!id) {

                    showMessage(
                        "يرجى إدخال الـ ID."
                    );

                    userId.focus();

                    return;

                }


                setButtonLoading(
                    true
                );


                try {


                    /* =================================
                       FIRESTORE

                       users / ID
                    ================================= */

                    const reference =
                        doc(
                            db,
                            "users",
                            id
                        );


                    const snapshot =
                        await getDoc(
                            reference
                        );


                    /* =================================
                       NOT FOUND
                    ================================= */

                    if (
                        !snapshot.exists()
                    ) {

                        setButtonLoading(
                            false
                        );

                        showMessage(
                            "الـ ID الذي أدخلته غير موجود."
                        );

                        userId.focus();

                        return;

                    }


                    /* =================================
                       DATA
                    ================================= */

                    const data =
                        snapshot.data();


                    /* =================================
                       ACTIVE
                    ================================= */

                    if (
                        data.active === false
                    ) {

                        setButtonLoading(
                            false
                        );

                        showMessage(
                            "هذا الحساب غير مفعل حالياً."
                        );

                        return;

                    }


                    /* =================================
                       ROLE
                    ================================= */

                    const role =
                        String(
                            data.role || ""
                        )
                        .trim()
                        .toLowerCase();


                    /* =================================
                       CHECK ROLE
                    ================================= */

                    if (
                        !routes[role]
                    ) {

                        setButtonLoading(
                            false
                        );

                        showMessage(
                            "تعذر تحديد نوع هذا الحساب."
                        );

                        console.error(
                            "Invalid account role:",
                            role
                        );

                        return;

                    }


                    /* =================================
                       SESSION DATA
                    ================================= */

                    const session = {

                        id: id,

                        name:
                            data.name || "",

                        role: role,

                        loginTime:
                            Date.now()

                    };


                    sessionStorage.setItem(
                        "tahadiUser",
                        JSON.stringify(
                            session
                        )
                    );


                    /* =================================
                       SUCCESS MESSAGE
                    ================================= */

                    showMessage(
                        "تم تسجيل الدخول بنجاح.",
                        "success"
                    );


                    /* =================================
                       PAGE LOADER
                    ================================= */

                    setTimeout(
                        function() {

                            pageLoader.classList.add(
                                "active"
                            );

                        },
                        250
                    );


                    /* =================================
                       REDIRECT
                    ================================= */

                    setTimeout(
                        function() {

                            window.location.href =
                                routes[
                                    role
                                ];

                        },
                        700
                    );


                } catch (error) {


                    console.error(
                        "Firebase error:",
                        error
                    );


                    setButtonLoading(
                        false
                    );


                    /* =================================
                       FIRESTORE PERMISSION
                    ================================= */

                    if (
                        error.code ===
                        "permission-denied"
                    ) {

                        showMessage(
                            "لا توجد صلاحية للوصول إلى بيانات الحساب."
                        );

                        return;

                    }


                    /* =================================
                       GENERAL ERROR
                    ================================= */

                    showMessage(
                        "حدث خطأ أثناء الاتصال. تأكد من الإنترنت وإعدادات Firebase."
                    );


                }

            }
        );


        /* ========================================
           INPUT
        ========================================= */

        userId.addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                        .replace(
                            /\s/g,
                            ""
                        )
                        .toUpperCase();

            }
        );


        /* ========================================
           LOGO ERROR
        ========================================= */

        schoolLogo.addEventListener(
            "error",
            function() {

                schoolLogo.style.display =
                    "none";

                logoFallback.style.display =
                    "flex";

            }
        );


        /* ========================================
           AUTO FOCUS
        ========================================= */

        window.addEventListener(
            "load",
            function() {

                setTimeout(
                    function() {

                        userId.focus();

                    },
                    600
                );

            }
        );


    </script>


</body>

</html>
